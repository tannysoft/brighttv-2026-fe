# Local Postgres for the CMS (production uses PlanetScale Postgres via Hyperdrive).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: brighttv_cms
    ports:
      - "54329:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_wal_size=4GB", "-c", "synchronous_commit=off"]
